[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:surrealdb]
command=surreal start --log info --user root --pass root --bind 0.0.0.0:8000 rocksdb:/app/surreal_data/mydatabase.db
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=1
autostart=true

[program:api]
command=uv run --no-sync uvicorn api.main:app --host 0.0.0.0 --port 5055
directory=/app
environment=DEMO_MODE="true",USE_GPU="false"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10
autostart=true
startsecs=5

[program:worker]
command=uv run --no-sync surreal-commands-worker --import-modules commands
directory=/app
environment=DEMO_MODE="true"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20
autostart=true
startsecs=8

[program:frontend]
command=bash -c "/app/scripts/wait-for-api.sh && npx serve dist -s -l tcp://0.0.0.0:8502"
directory=/app/aria-frontend
environment=NODE_ENV="production",PORT="8502"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=30
autostart=true
startsecs=10
